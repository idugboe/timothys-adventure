<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241044">
<title>Timothy's Adventure</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160a29;touch-action:none;overscroll-behavior:none}
  body{position:fixed;inset:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif} #game{width:100vw;height:100dvh;overflow:hidden}
  canvas{display:block;touch-action:none}
</style>
</head>
<body><div id="game"></div>
<script>
'use strict';

// Edit these arrays to add or tune levels. Coordinates use a 960x540 camera view.
const LEVELS = [
  {name:'Sunset Trail', width:1900, speed:115, platforms:[[0,490,420],[500,490,320],[900,490,390],[1390,490,510],[370,400,130],[720,360,150],[1110,405,145]], coins:[[180,445],[300,445],[420,355],[585,445],[770,315],[990,445],[1160,360],[1490,445],[1660,445]], spikes:[[600,474,70],[1030,474,70]], enemies:[[290,458,230,390],[820,458,760,860],[1500,458,1440,1550]], exit:[1815,430]},
  {name:'Crystal Caves', width:2200, speed:140, platforms:[[0,490,270],[350,490,250],[700,490,300],[1100,490,260],[1460,490,300],[1850,490,350],[230,390,125],[540,350,130],[900,395,130],[1270,340,140],[1640,395,130]], coins:[[110,445],[275,345],[425,445],[595,305],[790,445],[960,350],[1180,445],[1330,295],[1550,445],[1695,350],[1940,445],[2070,445]], spikes:[[170,474,60],[435,474,60],[780,474,65],[1190,474,65],[1570,474,60],[1970,474,70]], enemies:[[120,458,75,210],[485,458,380,565],[840,458,730,970],[1540,458,1480,1660],[1910,458,1870,2100]], exit:[2115,430]},
  {name:'Golden Summit', width:2550, speed:165, platforms:[[0,490,250],[340,490,210],[650,490,230],[1000,490,210],[1320,490,240],[1680,490,200],[1990,490,210],[2310,490,330],[180,390,120],[470,340,120],[790,385,120],[1135,330,125],[1480,380,120],[1810,330,120],[2110,385,130]], coins:[[90,445],[240,345],[405,445],[525,295],[720,445],[845,340],[1080,445],[1195,285],[1400,445],[1535,335],[1760,445],[1870,285],[2070,445],[2170,340],[2400,445]], spikes:[[145,474,65],[390,474,55],[720,474,60],[1050,474,65],[1395,474,70],[1740,474,60],[2050,474,65],[2370,474,60]], enemies:[[90,458,50,205],[395,458,355,535],[720,458,680,845],[1080,458,1020,1190],[1410,458,1360,1540],[1750,458,1710,1850],[2070,458,2020,2190],[2390,458,2340,2510]], exit:[2465,430]}
];
const W=960,H=540;

class Adventure extends Phaser.Scene {
  constructor(){super('adventure');}
  create(){
    this.score=0; this.health=3; this.levelIndex=0; this.best=this.readBest(); this.muted=false; this.audioCtx=null;
    this.makeTextures(); this.makeMenu();
    this.keys=this.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,A,D,W,ESC');
    this.input.on('pointerdown',()=>this.unlockAudio());
  }
  readBest(){try{return Number(localStorage.getItem('timothysAdventureBest'))||0;}catch(_){return 0;}}
  saveBest(){if(this.score>this.best){this.best=this.score;try{localStorage.setItem('timothysAdventureBest',String(this.best));}catch(_){}}}
  makeTextures(){
    if(!this.textures.exists('hero')){const c=this.textures.createCanvas('hero',34,42),g=c.getContext();g.clearRect(0,0,34,42);g.fillStyle='#7b3fe4';g.fillRect(7,8,20,28);g.fillStyle='#9c68f2';g.fillRect(9,3,16,12);g.fillStyle='#ffd700';g.fillRect(11,13,12,7);g.fillStyle='#fff';g.fillRect(13,9,3,4);g.fillRect(21,9,3,4);g.fillStyle='#281047';g.fillRect(14,10,2,3);g.fillRect(22,10,2,3);g.fillStyle='#ffd700';g.fillRect(4,34,12,6);g.fillRect(19,34,12,6);g.fillRect(5,20,5,13);g.fillRect(24,20,5,13);c.refresh();}
    const make=(key,w,h,draw)=>{if(this.textures.exists(key))return;const gr=this.make.graphics({x:0,y:0,add:false});draw(gr);gr.generateTexture(key,w,h);gr.destroy();};
    make('ground',32,32,g=>{g.fillStyle(0x53308b);g.fillRect(0,0,32,32);g.fillStyle(0x8b5bd6);g.fillRect(0,0,32,7);g.fillStyle(0x39205f);g.fillRect(0,26,32,6);});
    make('coin',24,24,g=>{g.fillStyle(0xffd700);g.fillCircle(12,12,11);g.fillStyle(0xfff09a);g.fillCircle(12,12,7);g.fillStyle(0xe5a900);g.fillRect(10,6,4,12);});
    make('enemy',34,30,g=>{g.fillStyle(0xe24b65);g.fillRoundedRect(2,7,30,21,7);g.fillStyle(0xffc5c5);g.fillRect(9,12,5,6);g.fillRect(21,12,5,6);g.fillStyle(0x421b3e);g.fillRect(10,14,3,4);g.fillRect(22,14,3,4);g.fillStyle(0x592a74);g.fillRect(6,26,7,4);g.fillRect(22,26,7,4);});
    make('spike',28,26,g=>{g.fillStyle(0xe75d83);g.fillTriangle(0,26,14,0,28,26);g.fillStyle(0xffa1ad);g.fillTriangle(4,25,14,7,13,25);});
    make('exit',42,60,g=>{g.fillStyle(0xffd700);g.fillRect(4,0,5,60);g.fillStyle(0x7b3fe4);g.fillRect(9,3,30,23);g.fillStyle(0xffd700);g.fillTriangle(18,7,31,14,18,22);});
  }
  makeMenu(){
    this.cameras.main.setBackgroundColor('#241044');
    this.add.text(W/2,115,"TIMOTHY'S ADVENTURE",{fontSize:'42px',fontStyle:'bold',color:'#ffd700',stroke:'#32185b',strokeThickness:6}).setOrigin(.5);
    this.add.text(W/2,178,'A purple-and-gold platform adventure',{fontSize:'19px',color:'#e6d7ff'}).setOrigin(.5);
    this.add.text(W/2,245,'Collect coins  •  stomp enemies  •  reach the flag',{fontSize:'17px',color:'#fff'}).setOrigin(.5);
    this.add.text(W/2,282,'Move: ← → / A D     Jump: ↑ / W / Space',{fontSize:'16px',color:'#d1bdf4'}).setOrigin(.5);
    this.button(W/2,355,'START ADVENTURE',()=>{this.score=0;this.health=3;this.levelIndex=0;this.startLevel();});
    this.add.text(W/2,420,`BEST SCORE  ${this.best}`,{fontSize:'18px',color:'#ffd700'}).setOrigin(.5);
    this.add.text(W/2,480,'Touch controls are shown during play. Tap sound to mute/unmute.',{fontSize:'14px',color:'#bca4df'}).setOrigin(.5);
  }
  button(x,y,label,fn,width=250){const box=this.add.rectangle(x,y,width,54,0x7b3fe4).setStrokeStyle(3,0xffd700).setInteractive({useHandCursor:true});const text=this.add.text(x,y,label,{fontSize:'20px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);box.on('pointerover',()=>box.setFillStyle(0x925cf0));box.on('pointerout',()=>box.setFillStyle(0x7b3fe4));box.on('pointerdown',fn);return {box,text};}
  unlockAudio(){if(!this.audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.audioCtx=new AC();}if(this.audioCtx?.state==='suspended')this.audioCtx.resume();}
  tone(kind){if(this.muted)return;this.unlockAudio();if(!this.audioCtx)return;const ctx=this.audioCtx,now=ctx.currentTime;const presets={jump:[540,.09,'square'],coin:[880,.12,'sine'],stomp:[180,.13,'triangle'],hurt:[120,.22,'sawtooth'],victory:[660,.35,'sine']};const [freq,duration,type]=presets[kind]||presets.coin;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);if(kind==='coin'||kind==='victory')osc.frequency.exponentialRampToValueAtTime(freq*1.5,now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.12,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02);}
  startLevel(){
    this.children.removeAll(true);this.physics.world.resume();this.isPaused=false;this.isGameOver=false;this.transitioning=false;this.jumpHeld=false;this.isPlaying=true;this.level=LEVELS[this.levelIndex];
    this.physics.world.setBounds(0,0,this.level.width,H+220);this.cameras.main.setBounds(0,0,this.level.width,H);this.cameras.main.setBackgroundColor(this.levelIndex===1?'#171d3c':this.levelIndex===2?'#342044':'#241044');
    this.platforms=this.physics.add.staticGroup();for(const [x,y,w] of this.level.platforms){for(let px=x;px<x+w;px+=32){const tile=this.platforms.create(px+16,y,'ground');tile.setOrigin(.5,.5).refreshBody();}}
    this.player=this.physics.add.sprite(70,420,'hero').setDepth(5);this.player.setCollideWorldBounds(false);this.player.body.setSize(22,36).setOffset(6,5);this.player.setMaxVelocity(260,700);this.player.setBounce(0);
    this.physics.add.collider(this.player,this.platforms);
    this.coins=this.physics.add.staticGroup();for(const [x,y] of this.level.coins){const c=this.coins.create(x,y,'coin');c.refreshBody();}
    this.physics.add.overlap(this.player,this.coins,(_,coin)=>{if(!coin.active)return;coin.disableBody(true,true);this.score+=10;this.saveBest();this.tone('coin');this.refreshHud();});
    this.enemies=this.physics.add.group({allowGravity:false,immovable:true});for(const [x,y,min,max] of this.level.enemies){const e=this.enemies.create(x,y,'enemy');e.setSize(28,24).setOffset(3,4);e.patrol={min,max};e.direction=1;e.setVelocityX(this.level.speed);}
    this.physics.add.collider(this.enemies,this.platforms);
    this.physics.add.overlap(this.player,this.enemies,(p,e)=>this.hitEnemy(p,e));
    this.hazards=this.physics.add.staticGroup();for(const [x,y,w] of this.level.spikes){for(let px=x;px<x+w;px+=28){const spike=this.hazards.create(px+14,y,'spike');spike.refreshBody();}}
    this.physics.add.overlap(this.player,this.hazards,()=>this.hurt());
    const [ex,ey]=this.level.exit;this.exit=this.physics.add.staticImage(ex,ey,'exit');this.exit.refreshBody();this.physics.add.overlap(this.player,this.exit,()=>this.finishLevel());
    this.cameras.main.startFollow(this.player,true,.12,.12);
    this.makeHud();this.makeTouchControls();this.refreshHud();
  }
  makeHud(){this.hud=this.add.text(16,14,'',{fontSize:'18px',fontStyle:'bold',color:'#fff',stroke:'#21103e',strokeThickness:4}).setScrollFactor(0).setDepth(20);this.levelLabel=this.add.text(W/2,16,'',{fontSize:'17px',fontStyle:'bold',color:'#ffd700',stroke:'#21103e',strokeThickness:4}).setOrigin(.5,0).setScrollFactor(0).setDepth(20);
    this.pauseBtn=this.add.text(W-115,15,'Ⅱ  PAUSE',{fontSize:'17px',fontStyle:'bold',color:'#fff',backgroundColor:'#58328b',padding:{x:11,y:8}}).setScrollFactor(0).setDepth(25).setInteractive();this.pauseBtn.on('pointerdown',()=>this.showPause());
    this.muteBtn=this.add.text(W-115,58,'♪ SOUND',{fontSize:'15px',fontStyle:'bold',color:'#ffd700',backgroundColor:'#58328b',padding:{x:11,y:7}}).setScrollFactor(0).setDepth(25).setInteractive();this.muteBtn.on('pointerdown',()=>{this.muted=!this.muted;this.muteBtn.setText(this.muted?'♪ MUTED':'♪ SOUND');if(!this.muted)this.tone('coin');});
  }
  refreshHud(){if(!this.hud)return;this.hud.setText(`SCORE ${this.score}   ♥ ${this.health}   BEST ${this.best}`);this.levelLabel?.setText(`LEVEL ${this.levelIndex+1}/${LEVELS.length}: ${this.level?.name||''}`);}
  makeTouchControls(){
    this.touch={left:false,right:false,jump:false};const add=(x,y,label,key)=>{const circle=this.add.circle(x,y,36,0x46266f,.78).setStrokeStyle(3,0xffd700,.95).setScrollFactor(0).setDepth(30).setInteractive();const txt=this.add.text(x,y,label,{fontSize:'27px',fontStyle:'bold',color:'#fff'}).setOrigin(.5).setScrollFactor(0).setDepth(31);const set=v=>{this.touch[key]=v;circle.setFillStyle(v?0x8a5ae0:0x46266f,v?.95:.78);};circle.on('pointerdown',p=>{p.event?.preventDefault?.();set(true);});circle.on('pointerup',()=>set(false));circle.on('pointerout',()=>set(false));circle.on('pointerupoutside',()=>set(false));return circle;};
    add(58,H-72,'◀','left');add(148,H-72,'▶','right');add(W-78,H-72,'▲','jump');
  }
  hitEnemy(p,e){if(!e.active||this.isPaused)return;const falling=p.body.velocity.y>20&&p.body.bottom<e.body.top+18;if(falling){e.disableBody(true,true);p.setVelocityY(-330);this.score+=25;this.saveBest();this.tone('stomp');this.refreshHud();}else if((this.invulnerableUntil||0)<this.time.now)this.hurt();}
  hurt(){if(this.isPaused||this.isGameOver||this.time.now<(this.invulnerableUntil||0))return;this.health--;this.invulnerableUntil=this.time.now+1100;this.tone('hurt');this.refreshHud();this.player.setTint(0xffa0a0);this.time.delayedCall(180,()=>{if(this.player?.active)this.player.clearTint();});if(this.health<=0){this.endGame(false);return;}this.player.setVelocityY(-260);this.player.setX(Math.max(40,this.player.x-55));}
  finishLevel(){if(this.transitioning||this.isPaused)return;this.transitioning=true;this.tone('victory');if(this.levelIndex+1<LEVELS.length){this.levelIndex++;this.time.delayedCall(450,()=>this.startLevel());}else this.time.delayedCall(450,()=>this.endGame(true));}
  endGame(won){if(this.isGameOver)return;this.isGameOver=true;this.physics.world.pause();this.saveBest();this.children.removeAll(true);this.cameras.main.stopFollow();this.cameras.main.setScroll(0,0);this.cameras.main.setBackgroundColor('#241044');this.add.text(W/2,145,won?'ADVENTURE COMPLETE!':'GAME OVER',{fontSize:'40px',fontStyle:'bold',color:won?'#ffd700':'#ff7b9a',stroke:'#32185b',strokeThickness:6}).setOrigin(.5);this.add.text(W/2,215,`SCORE  ${this.score}     BEST  ${this.best}`,{fontSize:'23px',color:'#fff'}).setOrigin(.5);this.button(W/2,305,'PLAY AGAIN',()=>{this.score=0;this.health=3;this.levelIndex=0;this.startLevel();});this.button(W/2,380,'MAIN MENU',()=>{const paused=this.isPaused;this.children.removeAll(true);this.isPaused=paused;this.isGameOver=false;this.transitioning=false;this.isPlaying=true;this.makeMenu();});}
  showPause(){if(this.isPaused||!this.isPlaying)return;this.isPaused=true;this.physics.world.pause();this.pauseShade=this.add.rectangle(W/2,H/2,W,H,0x10071f,.82).setScrollFactor(0).setDepth(40);this.add.text(W/2,125,'PAUSED',{fontSize:'40px',fontStyle:'bold',color:'#ffd700'}).setOrigin(.5).setScrollFactor(0).setDepth(41);this.button(W/2,220,'RESUME',()=>this.hidePause()).box.setScrollFactor(0).setDepth(42);this.button(W/2,295,'RESTART LEVEL',()=>this.startLevel()).box.setScrollFactor(0).setDepth(42);this.button(W/2,370,'QUIT TO MENU',()=>{this.isPlaying=false;this.children.removeAll(true);this.makeMenu();}).box.setScrollFactor(0).setDepth(42);}
  hidePause(){if(!this.isPaused)return;this.isPaused=false;for(const obj of [...this.children.list])if(obj.depth>=40)obj.destroy();this.physics.world.resume();}
  update(){if(!this.isPlaying||this.isPaused||!this.player?.active)return;const k=this.keys;const left=this.touch?.left||k.LEFT.isDown||k.A.isDown;const right=this.touch?.right||k.RIGHT.isDown||k.D.isDown;const jump=this.touch?.jump||k.UP.isDown||k.W.isDown||k.SPACE.isDown;const body=this.player.body;
    body.setVelocityX(left===right?0:left?-185:185);if(jump&&body.blocked.down&&!this.jumpHeld){this.player.setVelocityY(-430);this.tone('jump');}this.jumpHeld=!!jump;
    for(const e of this.enemies.getChildren()){if(!e.active)continue;if(e.x<=e.patrol.min){e.x=e.patrol.min;e.direction=1;}else if(e.x>=e.patrol.max){e.x=e.patrol.max;e.direction=-1;}e.setVelocityX(e.direction*this.level.speed);}
    if(this.player.y>H+75)this.hurt();
  }
}
const config={type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#241044',physics:{default:'arcade',arcade:{gravity:{y:1050},debug:false}},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:4},scene:[Adventure]};
new Phaser.Game(config);
</script></body></html>
